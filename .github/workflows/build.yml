name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SteadyDots.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SteadyDots-apk
          path: SteadyDots.apk

      # Always-current download link: Releases -> "latest" -> SteadyDots.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SteadyDots.apk \
            --title "Steady Dots (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Tap SteadyDots.apk below to download and install."
